version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /mobile
    schedule: { interval: weekly }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Expo-managed packages move together, through `npx expo install expo@^NN --fix` on a
      # dedicated SDK-upgrade PR. Dependabot bumping one of them alone breaks the app.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "jest-expo"
      - dependency-name: "@types/react"
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "glob"
        # Blocked transitively by Expo SDK 58 tooling (@expo/cli -> @expo/config -> glob ^13),
        # and Dependabot cannot reach the first fixed version (14.0.2) until an SDK upgrade.
        # Ignore for now so the Dependabot workflow doesn't fail on an impossible security bump.
